<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat about Ilmu Kebumian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ios-blue:#0b84ff;
    --bubble-grey:#e9e9eb;
    --text-grey:#3c3c43;
    --hairline:#e2e2e6;
    --status-bg:#f6f6f8;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    max-width:420px;
    margin:0 auto;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }

  /* ---- Phone frame ---- */
  #phone{
    width:100%;
    max-width:390px;
    aspect-ratio:390/844;
    max-height:92vh;
    background:#fff;
    border-radius:44px;
    border:8px solid #111;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---- Nav header ---- */
  #chat-header{
    background:var(--status-bg);
    padding:16px 12px 10px;
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    border-bottom:1px solid var(--hairline);
  }
  #header-center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  #avatar{
    width:36px; height:36px;
    border-radius:50%;
    background:linear-gradient(135deg,#4c8a68,#2f6b8f);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  #contact-name{
    font-size:12.5px;
    font-weight:600;
    color:#000;
  }

  /* ---- Chat area ---- */
  #chat-box{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    background:#fff;
  }
  #chat-box::-webkit-scrollbar{ width:0; }

  .day-label{
    text-align:center;
    font-size:11px;
    color:#8e8e93;
    margin:6px 0 10px;
  }

  .row{ display:flex; flex-direction:column; max-width:78%; }
  .row.user{ align-self:flex-end; align-items:flex-end; }
  .row.ai{ align-self:flex-start; align-items:flex-start; }

  .bubble{
    padding:9px 14px;
    line-height:1.35;
    font-size:16px;
    word-wrap:break-word;
    border-radius:20px;
    position:relative;
  }
  .bubble strong{ font-weight:700; }
  .bubble em{ font-style:italic; }
  .bubble code{
    font-family:ui-monospace, 'SF Mono', monospace;
    font-size:0.85em;
    background:rgba(0,0,0,0.08);
    padding:1px 5px;
    border-radius:5px;
  }

  .user .bubble{
    background:var(--ios-blue);
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .ai .bubble{
    background:var(--bubble-grey);
    color:#000;
    border-bottom-left-radius:5px;
  }

  .meta{
    font-size:10.5px;
    color:#8e8e93;
    margin:3px 6px 0;
  }

  .dots{ display:inline-flex; gap:4px; align-items:center; height:16px; padding:2px 3px; }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background:#9a9aa0;
    animation:bounce 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay:0.15s; }
  .dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  .empty-hint{
    margin:auto;
    text-align:center;
    padding:30px 20px;
    color:#a8a8ad;
    font-size:13px;
  }
  .empty-hint b{ display:block; color:#6b6b70; font-size:15px; font-weight:600; margin-bottom:4px; }

  /* ---- Input bar ---- */
  #input-bar{
    flex-shrink:0;
    background:var(--status-bg);
    border-top:1px solid var(--hairline);
    padding:8px 10px calc(10px + env(safe-area-inset-bottom, 10px));
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    width:30px; height:30px;
    flex-shrink:0;
    color:var(--ios-blue);
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; cursor:pointer;
    padding:0;
  }
  #input-pill{
    flex:1;
    display:flex;
    align-items:center;
    background:#fff;
    border:1px solid #d1d1d6;
    border-radius:20px;
    padding:0 6px 0 14px;
    min-height:36px;
  }
  #question{
    flex:1;
    border:none;
    outline:none;
    font-size:16px;
    font-family:'Inter', sans-serif;
    padding:8px 0;
    background:transparent;
    color:#000;
  }
  #question::placeholder{ color:#a8a8ad; }

  #send-btn{
    width:28px; height:28px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:var(--ios-blue);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .1s ease, background .15s ease;
  }
  #send-btn:disabled{ background:#c7c7cc; cursor:not-allowed; }
  #send-btn:active:not(:disabled){ transform:scale(0.92); }
  #send-btn:focus-visible, #question:focus-visible{ outline:2px solid var(--ios-blue); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .dots span{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div id="phone">

  <div id="chat-header">
    <div id="header-center">
      <div id="avatar">🌍</div>
      <div id="contact-name">Ilmu Kebumian AI</div>
    </div>
  </div>

  <div id="chat-box">
    <div class="empty-hint" id="empty-hint">
      <b>Say hello 👋</b>
      Ask anything about geology, geodesy, or geography.
    </div>
  </div>

  <div id="input-bar">
    <div id="input-pill">
      <input id="question" type="text" placeholder="Ask a question…" autocomplete="off" />
    </div>
    <button id="send-btn" aria-label="Send">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 11.5V2.5M7 2.5 2.5 7M7 2.5 11.5 7" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const questionInput = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const emptyHint = document.getElementById('empty-hint');

  // Change this URL if your backend is hosted elsewhere
  const BACKEND_URL = 'http://localhost:3000/api/chat';

  // --- mini markdown renderer: escape first, then render **bold**, *italic*, `code` ---
  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMarkdownLite(text){
    let safe = escapeHtml(text);
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    safe = safe.replace(/\n/g, '<br>');
    return safe;
  }

  function addBubble(text, sender, opts = {}){
    if (emptyHint) emptyHint.remove();

    const row = document.createElement('div');
    row.className = 'row ' + sender;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (opts.loading) {
      bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    } else {
      bubble.innerHTML = renderMarkdownLite(text);
    }

    row.appendChild(bubble);

    if (!opts.loading && sender === 'user') {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'Delivered';
      row.appendChild(meta);
    }

    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
    return row;
  }

  async function sendQuestion(){
    const text = questionInput.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    questionInput.value = '';
    sendBtn.disabled = true;

    const loadingRow = addBubble('', 'ai', { loading: true });

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text })
      });
      const data = await res.json();

      loadingRow.remove();
      addBubble(data.answer || 'Sorry, something went wrong.', 'ai');
    } catch (err) {
      loadingRow.remove();
      addBubble('Could not reach the server.', 'ai');
    }

    sendBtn.disabled = false;
    questionInput.focus();
  }

  sendBtn.addEventListener('click', sendQuestion);
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuestion();
  });
</script>

</body>
</html>
